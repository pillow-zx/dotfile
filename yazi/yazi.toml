[opener]
edit = [
    { run = 'vim "$@"', block = true, desc = "vim"}
]

play = [
    { run = 'mpv "$@"', orphans = true, desc = "MPV" }
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
    { name = "*.{txt,md,py,sh,lua,js,c,cpp,cc,rs,java,conf,toml,yaml,yml,json,jsonc}", use = "edit" },
    { mime = "video/*", use = "play" },
    { name = "*.{mp4,mkv,webm,avi,mov}", use = "play" },
]
